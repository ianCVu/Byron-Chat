<html>
  <head>
    <style>
      body {
        background-color: white;
        color: black;
        font-family: Courier New;
        font-weight: bold;
      }
      #logs {
        position: absolute;
        left: 2px;
        top: 0px;
      }
      input {
        position: fixed;
        background-color: white;
        color: black;
        font-family: Courier New;
        font-weight: bold;
        top: 0px;
        width: 100%;
        z-index: 99999;
        border-color: gray;
        border-width: 1px;
      }
    </style>
  </head>
  <body>
    <input id="input" type="text">
    <h5 id="logs">
      <p>Welcome to Byron Chat!</p>
      <p>Please input username to begin</p>
      <p>This project is a test release of Chipmunk Chat 2.0, so please respect the license of this project (<a href="https://github.com/ianCVu/Byron-Chat/blob/main/LICENSE">Github License</a>).</p>
    </h5>
    <script>
      const logs = document.getElementById("logs");
      const input = document.getElementById("input");
      let username = null;
      let it = "username";
      input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          if (it === "username") {
            username = input.value;
            input.value = "";
            logs.innerHTML = "";
            setInterval(logMessages, 17);
            it = "message";
          } else if (it === "message") {
            google.script.run.pushMessages(username, input.value);
            input.value = "";
          }
        }
      });
      let lm = -1;
      function logMessages() {
        google.script.run.withSuccessHandler(function(messages) {
          if (messages[lm + 1]) {
            var message = messages[lm + 1];
            var log = document.createElement("p");
            log.textContent = message.username + ": " + message.content + "(" + message.date + ")";
            logs.appendChild(log);
            lm = lm + 1;
          }
        }).importMessages();
      }
    </script>
  </body>
</html>
